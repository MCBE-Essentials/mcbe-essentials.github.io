<!DOCTYPE html>
<html>
  <head>
    <title>Item engine test: view all items</title>
    <script src="/script.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <style>
      #head {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="head"></div>
    <div id="items">
      
    </div>
  </body>
</html>
<script>
var identifiers = {};
async function fetchData(){
  identifiers = await fetch(
		'https://raw.githubusercontent.com/bridge-core/editor-packages/main/packages/minecraftBedrock/schema/general/vanilla/identifiers.json'
	).then((response) => response.json())
  
  doIdentifiers();
}

function doIdentifiers(){
  let realIds = identifiers.definitions.prefixed_item_identifiers.enum;
  let container = document.getElementById("items");
  container.innerHTML = "";

  for(var i = 0; i < realIds.length; i++){
    let id = realIds[i];
    if(id.startsWith("minecraft:element_")) continue;

    // Verifica se esse ID tem múltiplas variações no mapping
    let mappedData = mcitems.data.mapping[id];

    if(Array.isArray(mappedData)){
      // Se for um array (como poções, lãs, corantes), cria todos
      for(let d = 0; d < mappedData.length; d++){
        container.innerHTML += `<mcitem identifier="${id}" damage="${d}" count="1"></mcitem>`;
      }
    } else {
      // Se não for array, cria apenas o item normal
      container.innerHTML += `<mcitem identifier="${id}" count="1"></mcitem>`;
    }
  }
  mcitems.init();
}

  fetchData()
</script>
