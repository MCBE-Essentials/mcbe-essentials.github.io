<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#26203a" />
    <link
      rel="icon"
      href="/assets/bcse.png"
    />
    
    <title>MCBE Essentials</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="./style.css">

    <!-- import the webpage's javascript file -->
    <script src="/apps.js" defer></script>
    <script src="/script.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div id="head" class="header">
        <img src="/assets/bcse.png" class="imgicon">
      <span class="imgicontext">MCBE Essentials</span>
    </div>
    <div id="body" class="main-content">
      <div id="left" class="main-left">
      </div>
      <div id="right" class="main-right" style="font-family: Minecraftia;text-align:center;">
        <h1>NBT Editor</h1>
        <table class="app-main">
          <tbody>
            <tr>
              <td class="app-inner main-page">
                <div id="editor">
                  
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <br>
        This app allows you to directly edit NBT data.<br><br>
      </div>
    </div>
    <div class="menu-button2"
         onmouseover="this.children[0].src='/assets/icons/elipses.png'"
         onmouseleave="this.children[0].src='/assets/icons/permissions_custom_dots.png'"
         onclick="toggleMenu(this)"
         >
      <img src="/assets/icons/permissions_custom_dots.png" style="margin: 20px 8px;width:28px;image-rendering:pixelated;">
    </div>
  </body>
</html>
