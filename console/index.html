<!DOCTYPE html>
<html>
  <head>
    <title>Console</title>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <button onclick="window.opener.reloadCSS();">Reload Stylesheets</button><br>
    <button onclick="window.opener.getData();">Reload Identifier Data</button><br>
    <button onclick="window.opener.location.reload(); window.setTimeout(refreshStylesheets, 3000)">Refresh Page</button>
    <button onclick="closeOverlays();">Close all overlays</button>
    <br>
    <select oninput="importPresetFile(this)">
      <option value="#">(Import a file to the program)</option>
      <option value="/assets/structures/StructureEditorCompleteFeatureTest.mcstructure">StructureEditorCompleteFeatureTest</option>
      <option value="/assets/structures/bobby.mcstructure">StructureEditorBobby</option>
      <option value="/assets/structures/1.20%20test.mcstructure">1.20 Test</option>
      <option value="/assets/structures/Complete1.20FeatureTest.mcstructure">Complete1.20FeatureTest</option>
      <option value="/assets/structures/Complete121Test.mcstructure">Complete1.21FeatureTest</option>
    </select>
    <br><br>
    <details open style="user-select: none;">
      <summary>Errors</summary>
      
      <div id="errors">
        
      </div>
    </details>
    <details>
      <summary>Stylesheets</summary>
      <input id="newstylesheet" value="style-oldest.css"><button onclick="addNewStylesheet()">Add</button>
      <ul id="stylesheets">
        
      </ul>
    </details>
  </body>
</html>
